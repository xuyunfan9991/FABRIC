  adaptive_batch_audit: /home2/xyf/project/FABRIC/data/processed/fabric_v2_real_dataset_atomic_introns_v1/AdaptiveBatchAudit.json
  batch_policy: gene_shape_adaptive_v1
  compute_precision: float32_highest
