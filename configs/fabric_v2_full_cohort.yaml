  optimizer_step_unit: train_positive_gene
  gene_microbatch_gradient_accumulation: true
  high_dtu_sensitivity:
    enabled: false
    primary_objective: false

monitor:
  enabled: true
  timing: once_after_each_completed_epoch
  selection_eligible: false
  sealed: true
  metric: ont_matrix_kl_count_weighted
  scope_policy: likelihood_informative_validation_cell_gene_with_at_least_two_positive_ont_paths
