contract: FABRIC_ARCHITECTURE_V1
claim_class: transductive_supervised_cell_holdout
interpretation_class: motif_and_cell_context_supported_association
screening_evidence_only: true

data:
  reuse_documented_cell_split: false
  target_sum_rna: 10000.0
  target_sum_atac: 10000.0
  state_pca_dim: 3
  atac_neighbors:
    exact_stage: true
    stage_field: synthetic_stage
    donor_id_field: synthetic_donor
    donor_eligibility_rule: explicit_boolean_mask
    k: 3
    weighting: softmax_negative_euclidean_distance
    temperature: 1.0

choices:
  rank_tolerance: 1.0e-8
  minimum_informative_molecule_mass: 2.0
  minimum_alternative_support: 1.0

motifs:
  dna_window_bp: 50
  rna_window_bp: 25
  dna_minimum_relative_score: 0.8
  rna_minimum_relative_score: 0.8
  dna_events_per_choice_cap: 16
  rna_events_per_choice_cap: 16

gates:
  minimum_valid_molecule_mass: 1.0
  minimum_weighted_variance: 1.0e-8

model:
  cis_hidden_dim: 16
  cis_heads: 2
  state_rank: 4
  dna_rank: 4
  rna_rank: 4
  path_length_prior_weight: 0.0

training:
  seed: 17
  learning_rate: 0.02
  weight_decay: 0.0
  max_epochs: 80
  variants: [cis, state, state_dna, state_rna, state_dna_rna]
  formal_full7198_authorized: false

admission:
  minimum_b0_validation_improvement: 0.0
  real_fixture_directory: tests/fixtures/real
